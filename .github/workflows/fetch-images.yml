name: Oefening-afbeeldingen ophalen

on:
  workflow_dispatch:
    inputs:
      update_only:
        description: 'Enkel nieuwe oefeningen toevoegen (sla bestaande over)'
        required: false
        default: 'true'
        type: boolean
      limit:
        description: 'Max aantal oefeningen (0 = alle 452)'
        required: false
        default: '0'

  schedule:
    # Elke zondag om 03:00 UTC — pikt nieuwe protocollen automatisch op
    - cron: '0 3 * * 0'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python 3.11 instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Afbeeldingen ophalen via Wikimedia Commons
        run: |
          ARGS=""
          if [ "${{ inputs.update_only }}" = "true" ]; then ARGS="$ARGS --update"; fi
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "Script argumenten: $ARGS"
          python3 fetch-exercise-images.py $ARGS

      - name: Resultaat samenvatten
        run: |
          python3 -c "
          import json
          with open('exercise-images.json') as f:
              d = json.load(f)
          print(f'Afbeeldingen in database: {len(d)}')
          for name, v in list(d.items())[:5]:
              print(f'  • {name[:50]}: {v[\"url\"][:60]}')
          "

      - name: Committen en pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exercise-images.json
          if git diff --staged --quiet; then
            echo "Geen nieuwe afbeeldingen — niets te committen."
          else
            COUNT=$(python3 -c "import json; print(len(json.load(open('exercise-images.json'))))")
            git commit -m "Oefening-afbeeldingen bijgewerkt: ${COUNT} entries [bot]"
            git push
            echo "✓ exercise-images.json gepushed (${COUNT} entries)"
          fi
