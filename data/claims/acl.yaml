# Claim-naar-bron koppeling voor het ACL-protocol (CLAUDE.md §3 fase C).
# `gedekt` mag alleen `ja` zijn als de opgehaalde bron het cijfer, de populatie
# en de conclusie werkelijk bevat.
protocol: acl
laatst_gecontroleerd: 2026-09-05
protocol_aangepast: >-
  2026-09-05, na beslissing van de kinesitherapeut: bronwaarden overnemen (1),
  testbatterij van Grindem overnemen (2), ontbrekende bronnen worden aangeleverd
  (3), typelijst uitgebreid met review en commentary (4).
versie: 2
fase_a_door: hoofdagent (PubMed MCP, eerstehands opgehaald)
fase_b_door: >-
  onafhankelijke verificator-agent met schone context, 2026-09-05. Heeft alle
  PMID's en DOI's opnieuw opgelost en de claimdekking gecontroleerd. Zeven
  correcties op fase A doorgevoerd, hieronder verwerkt.

claims:

  - id: acl_c01
    tekst: Postoperatieve revalidatie duurt 9-12 maanden
    plaats: protocols.acl fase 5 (Mnd 5-12) + criteria_go
    bronnen: [vanmelick_2016_aclrichtlijn]
    gedekt: ja
    opmerking: >-
      Abstract: "Postoperative rehabilitation should continue for 9-12 months."

  - id: acl_c02
    tekst: Doorstroom op criteria (testbatterij) in plaats van op tijd
    plaats: protocols.acl fase 2 evidence
    bronnen: [vanmelick_2016_aclrichtlijn]
    gedekt: ja
    opmerking: >-
      Abstract: drie criteriumgebaseerde postoperatieve fasen; testbatterij
      stuurt de doorstroom van fase naar fase.

  - id: acl_c03
    tekst: Minimum 9 maanden postoperatief voor return to sport
    plaats: protocols.acl fase 5 criteria_go
    bronnen: [grindem_2016_rtscriteria]
    gedekt: ja
    opmerking: >-
      Abstract: herletselpercentage daalt met 51% per maand uitstel tot
      9 maanden na de operatie; daarna geen verdere risicoreductie.

  - id: acl_c04
    tekst: LSI >= 90% op krachttests en hoptests voor return to sport
    plaats: protocols.acl fase 4 en 5 criteria_go
    bronnen: [grindem_2016_rtscriteria]
    gedekt: ja
    opmerking: >-
      OPGELOST 2026-09-05. Doorstroomcriteria fase 4 en 5 herschreven naar de
      volledige testbatterij van de bron: scores boven 90 op quadricepskracht,
      hoptests, Knee Outcome Survey ADL Scale en global rating scale of
      function. Let op bij interpretatie: het verschil tussen slagen en falen
      was in de bron niet significant (5,6% versus 38,2%, HR 0,16, p=0,075).

  - id: acl_c05
    tekst: RTS voor 9 maanden verhoogt het herletselrisico met factor 4-6
    plaats: protocols.acl fase 5 evidence
    bronnen: [grindem_2016_rtscriteria]
    gedekt: ja
    opmerking: >-
      OPGELOST 2026-09-05. "Factor 4-6" verwijderd. De evidencetekst van fase 5
      geeft nu de twee cijfers die werkelijk in de bron staan: 4,32x hoger
      herletselpercentage bij terugkeer naar niveau I-sport, en 51%
      risicoreductie per maand uitstel tot 9 maanden. Populatie (106
      pivoting-sporters) staat er expliciet bij.

  - id: acl_c06
    tekst: Quadriceps arthrogene spierinhibitie (AMI) is de grootste beperkende factor vroeg postoperatief
    plaats: protocols.acl fase 1 evidence
    bronnen: [rice_2010_ami]
    gedekt: ja
    opmerking: >-
      OPGELOST 2026-09-05. Superlatief "grootste limiterende factor" vervangen
      door "een belangrijke barriere", zoals de bron formuleert. Jaartal
      gecorrigeerd naar 2010 en de populatiebeperking (knieletsel en
      kniechirurgie in het algemeen, niet ACL-specifiek) staat nu expliciet
      in de evidencetekst.

  - id: acl_c07
    tekst: OKC knie-extensie veilig vanaf week 4-6 in bereik 90-40 graden
    plaats: protocols.acl fase 3 evidence + oefening "OKC Knie-extensie (90-40 graden)"
    bronnen: [fukuda_2013_okc]
    gedekt: ja
    opmerking: >-
      OPGELOST 2026-09-05. Oefening hernoemd naar "OKC Knie-extensie (45-90
      graden)" met parameter "Start: vanaf week 4", exact zoals onderzocht.
      Evidencetekst meldt nu dat het krachtverschil tussen de groepen niet
      significant was, en dat de populatie uitsluitend hamstringgraft betrof.

  - id: acl_c08
    tekst: BFR-training bij quadricepshypotrofie na ACL-reconstructie
    plaats: protocols.acl fase 3 evidence + oefening BFR Quadriceps
    bronnen: [hughes_2019_bfr_rct]
    gedekt: ja
    opmerking: >-
      RCT: 28 gerandomiseerd, 24 geanalyseerd (12 per groep), 8 weken,
      UITSLUITEND hamstring-autograft. Vergelijkbare toename van spierdikte
      (v. lateralis) en 10RM-kracht als zware weerstandstraining, met grotere
      afname van kniepijn en effusie; BFR remde het isokinetische krachtverlies
      sterker bij 150 en 300 graden per seconde. Niet zonder meer te
      veralgemenen naar patellapeesgraft (CLAUDE.md 1.5). LET OP: de app
      verwees naar Phys Ther Sport; die publicatie gaat over comfort en pijn,
      niet over hypertrofie. De juiste bron is Sports Medicine 2019.

  - id: acl_c09
    tekst: Plyometrie opgebouwd in 4 stadia (Buckthorpe & Roi, 2017)
    plaats: protocols.acl fase 4 evidence
    bronnen: [buckthorpe_2021_plyometrie]
    gedekt: ja
    opmerking: >-
      GECORRIGEERD NA FASE B. De claim klopt, maar stond onder de verkeerde
      bron. Het vierstadia-programma staat in Buckthorpe & Della Villa,
      Int J Sports Phys Ther 2021;16(3):879-895 - abstract letterlijk:
      "a four-stage plyometric program". Buckthorpe & Roi 2017 bestaat wel
      (Muscles Ligaments Tendons J 7(3):435-441) maar gaat over rate of force
      development, niet over plyometriestadia. Het betreft een clinical
      commentary: bij weergave labelen als expert opinion, niet als evidentie.
      VOORSTEL: bronvermelding in de app corrigeren.

  - id: acl_c10
    tekst: Isometrische quadriceps aan 60 graden veilig (Heijne & Werner, 2021)
    plaats: protocols.acl fase 2 evidence
    bronnen: []
    gedekt: nee
    opmerking: >-
      GEEN DEKKENDE BRON (motivering bijgesteld na fase B). Heijne A heeft
      wel een ACL-publicatie uit 2021 (Knee Surg Sports Traumatol Arthrosc
      30(7):2244-2250, PMID 34661692), maar dat is een kwalitatieve
      interviewstudie over herletsel - niet over isometrie bij 60 graden.
      Geen bron gevonden die de claim dekt. BESLISSING 2026-09-05: de
      kinesitherapeut levert een bron aan. De onjuiste bronvermelding is uit
      protocols.js verwijderd; de klinische uitspraak blijft staan met de
      notitie dat de bron nog aangeleverd wordt. WACHT OP BRON.
    verwerkt: >-
      GESCHRAPT 2026-09-07 op beslissing van de kinesitherapeut. Er is geen bron
      gevonden, dus conform CLAUDE.md par. 1.2 wordt de claim geschrapt in plaats
      van in wachtstand gehouden. De oefening zelf blijft in het protocol staan,
      maar nu uitdrukkelijk als klinische richtlijn zonder onderbouwing.

  - id: acl_c11
    tekst: ACL-RSI drempel >= 56 (fase 3) en >= 65 (fase 5) voor doorstroom
    plaats: protocols.acl fase 3 en 5 criteria_go + SCORES.acl
    bronnen: []
    gedekt: nee
    opmerking: >-
      GEEN BRON GEVERIFIEERD. De geraadpleegde ACL-RSI-publicatie (Webster &
      Feller, J Athl Train 2022;57(9-10):955-960, PMID 36638341) is een case
      series bij adolescenten tot en met 17 jaar en levert geen afkapwaarde:
      gerapporteerd worden ACL-RSI 55 naar 71 tussen 6 en 12 maanden en een
      AUC van 0,7. Die publicatie is daarom niet in references.yaml opgenomen.
      De drempels 56 en 65 blijven onderbouwd noch weerlegd. BESLISSING
      2026-09-05: de kinesitherapeut levert een bron aan. In protocols.js staat
      nu bij het criterium "(bron nog aan te leveren)". WACHT OP BRON.
    verwerkt: >-
      GESCHRAPT 2026-09-07 op beslissing van de kinesitherapeut. De
      doorstroomdrempels 56 en 65 zijn uit de fasedoelen en doorstroomcriteria
      verwijderd; de ACL-RSI blijft als meting staan zonder afkapwaarde. De
      stopcriteria die een verwijzing naar psychologische begeleiding sturen
      (< 40 en < 50) zijn BEHOUDEN maar gelabeld als praktijkafspraak - een lage
      score is een reden tot gesprek, en die vangnetfunctie schrappen zou de zorg
      verslechteren in plaats van verbeteren.

  - id: acl_c12
    tekst: IKDC MCID 11,5 punten en drempel >= 85 voor RTS
    plaats: SCORES.acl
    bronnen: []
    gedekt: nee
    opmerking: >-
      GEEN BRON GEVERIFIEERD. BESLISSING 2026-09-05: de kinesitherapeut levert
      een bron aan. In protocols.js staat nu bij het criterium
      "(bron nog aan te leveren)". WACHT OP BRON.
    verwerkt: >-
      GESCHRAPT 2026-09-07 op beslissing van de kinesitherapeut. De IKDC-drempel
      van 85 is uit de fasedoelen en doorstroomcriteria verwijderd; de IKDC blijft
      als meting staan zonder afkapwaarde. Het MCID van 11,5 punten werd nergens
      in de app als criterium gebruikt en verviel daarmee.

  - id: acl_c13
    tekst: >-
      SLR-oefening toonde "Positief < 70 graden" en "Specificiteit: hoog" in de
      parameters.
    plaats: lh fase 0 - oefeningparameters (gevonden bij visuele controle van de app)
    bronnen: [deville_2000_lasegue, vanderwindt_2010_lichamelijk_onderzoek]
    gedekt: nee
    opmerking: >-
      NIET GEVONDEN DOOR CODE-INSPECTIE MAAR DOOR NAAR HET SCHERM TE KIJKEN. Fase B
      had deze omkering aangewezen, maar bij het verwerken corrigeerde ik de
      slumptest ernaast en niet de SLR zelf. Beide bronnen geven juist een LAGE
      specificiteit (0,26 en 0,28) en noemen geen drempel van 70 graden. De
      parameters stonden direct onder een evidencetekst die het tegenovergestelde
      zei. Les: een claimdossier dat afgevinkt is, garandeert niet dat de app het
      toont - de laatste controle hoort in de app zelf te gebeuren.
    verwerkt: parameters vervangen door sensitiviteit 0,91 en specificiteit
      0,26 (LAAG), met de bron erbij; categorie gecorrigeerd van kracht naar test

  - id: acl_c14
    tekst: >-
      De klinische beslisbomen vormen een niet-geauditeerde laag die dezelfde
      weerlegde claims draagt.
    plaats: beslisbomen (aparte structuur in protocols.js)
    bronnen: [weber_1983_discushernia, kukkonen_2015_rotatorenmanchet, walker_2000_polsspalk_cts, itoi_2007_externe_rotatie]
    gedekt: nee
    opmerking: >-
      Bij het naveegwerk bleek dat de beslisbomen - de structuur die de
      kinesitherapeut bij de triage gebruikt - nooit in de audit zaten. Ze
      herhaalden claims die in de protocollen al weerlegd waren: "spontaan herstel
      bij 75% binnen 12 weken (Weber 1983)" (Weber bevat geen herstelpercentage),
      "Kukkonen: conservatief = chirurgisch bij < 50% dikte boven 55 jaar" (die
      trial hanteert geen van beide grenzen), "Walker 2000: 60-70% symptoomreductie"
      (staat er niet in), "Ottawa sensitiviteit 96-99%" (het bereik dat elders al
      geschrapt was), plus de recidiefpercentages per leeftijdsgroep en het
      Ilyas-cijfer van 50%. EEN UITZONDERING VERDIENT VERMELDING: de beslisboom bij
      schouderinstabiliteit gaf Burkhead & Rockwood correct weer (80% bij AMBRI,
      16% bij TUBS) - daar klopte de app.
    verwerkt: zeven beslisboomteksten gecorrigeerd of gelabeld; de correcte
      Burkhead-vermelding ongemoeid gelaten
