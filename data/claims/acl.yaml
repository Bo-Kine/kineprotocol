# Claim-naar-bron koppeling voor het ACL-protocol (CLAUDE.md §3 fase C).
# `gedekt` mag alleen `ja` zijn als de opgehaalde bron het cijfer, de populatie
# en de conclusie werkelijk bevat.
protocol: acl
laatst_gecontroleerd: 2026-09-05
versie: 1
fase_a_door: hoofdagent (PubMed MCP, eerstehands opgehaald)
fase_b_door: nog uit te voeren

claims:

  - id: acl_c01
    tekst: Postoperatieve revalidatie duurt 9-12 maanden
    plaats: protocols.acl fase 5 (Mnd 5-12) + criteria_go
    bronnen: [vanmelick_2016_aclrichtlijn]
    gedekt: ja
    opmerking: >-
      Abstract: "Postoperative rehabilitation should continue for 9-12 months."

  - id: acl_c02
    tekst: Doorstroom op criteria (testbatterij) in plaats van op tijd
    plaats: protocols.acl fase 2 evidence
    bronnen: [vanmelick_2016_aclrichtlijn]
    gedekt: ja
    opmerking: >-
      Abstract: drie criteriumgebaseerde postoperatieve fasen; testbatterij
      stuurt de doorstroom van fase naar fase.

  - id: acl_c03
    tekst: Minimum 9 maanden postoperatief voor return to sport
    plaats: protocols.acl fase 5 criteria_go
    bronnen: [grindem_2016_rtscriteria]
    gedekt: ja
    opmerking: >-
      Abstract: herletselpercentage daalt met 51% per maand uitstel tot
      9 maanden na de operatie; daarna geen verdere risicoreductie.

  - id: acl_c04
    tekst: LSI >= 90% op krachttests en hoptests voor return to sport
    plaats: protocols.acl fase 4 en 5 criteria_go
    bronnen: [grindem_2016_rtscriteria]
    gedekt: ja
    opmerking: >-
      Abstract: slaagcriteria gedefinieerd als scores >90 op alle tests;
      5,6% herletsel bij slagen versus 38,2% bij falen.

  - id: acl_c05
    tekst: RTS voor 9 maanden verhoogt het herletselrisico met factor 4-6
    plaats: protocols.acl fase 5 evidence
    bronnen: [grindem_2016_rtscriteria]
    gedekt: nee
    opmerking: >-
      NIET GEDEKT. De bron rapporteert 4,32x hoger herletselpercentage voor
      terugkeer naar niveau I-sport versus niet terugkeren - niet voor RTS
      voor 9 maanden. Voor timing rapporteert de bron 51% risicoreductie per
      maand uitstel tot 9 maanden. "Factor 4-6" staat nergens in de bron.
      VOORSTEL: herformuleren naar de twee cijfers die er wel in staan.

  - id: acl_c06
    tekst: Quadriceps arthrogene spierinhibitie (AMI) is de grootste beperkende factor vroeg postoperatief
    plaats: protocols.acl fase 1 evidence
    bronnen: [rice_2010_ami]
    gedekt: deels
    opmerking: >-
      De bron beschrijft AMI als een belangrijke barriere voor effectieve
      revalidatie na knieletsel en -chirurgie, en behandelt de neurale
      mechanismen. De superlatief "grootste limiterende factor" en de
      specifieke toepassing op ACL-reconstructie staan niet als zodanig in
      de bron. Het jaartal in de app (2019) klopt niet: PubMed geeft
      publicatiedatum 2009, nummer 40(3):250-66.

  - id: acl_c07
    tekst: OKC knie-extensie veilig vanaf week 4-6 in bereik 90-40 graden
    plaats: protocols.acl fase 3 evidence + oefening "OKC Knie-extensie (90-40 graden)"
    bronnen: [fukuda_2013_okc]
    gedekt: nee
    opmerking: >-
      GETAL WIJKT AF VAN DE BRON. De studie startte OKC in week 4 (niet 4-6)
      in een bereik van 45 tot 90 graden (niet 90 tot 40). Uitkomst: geen
      verschil in anterieure knielaxiteit versus late start, wel sneller
      quadricepsherstel. VOORSTEL: bereik en tijdstip overnemen zoals in de
      bron, of een andere bron zoeken die 90-40 graden onderbouwt.

  - id: acl_c08
    tekst: BFR-training bij quadricepshypotrofie na ACL-reconstructie
    plaats: protocols.acl fase 3 evidence + oefening BFR Quadriceps
    bronnen: [hughes_2019_bfr_rct]
    gedekt: ja
    opmerking: >-
      RCT (n=28, hamstringgraft, 8 weken): vergelijkbare toename spierdikte
      en kracht als zware weerstandstraining, met grotere afname van kniepijn
      en effusie. LET OP: de app verwees naar Phys Ther Sport; die publicatie
      (hughes_2019_bfr_pijn) gaat over comfort en pijn, niet over hypertrofie.
      De juiste bron voor deze claim is Sports Medicine 2019.

  - id: acl_c09
    tekst: Plyometrie opgebouwd in 4 stadia (Buckthorpe & Roi, 2017)
    plaats: protocols.acl fase 4 evidence
    bronnen: []
    gedekt: nee
    opmerking: >-
      BRON NIET GEVONDEN. Twee gerichte PubMed-zoekopdrachten leverden nul
      resultaten voor deze titel/auteurscombinatie. Volgens CLAUDE.md 1.2
      moet bron en claim geschrapt worden, tenzij de kinesitherapeut de
      publicatie kan aanwijzen. TE VERIFIEREN.

  - id: acl_c10
    tekst: Isometrische quadriceps aan 60 graden veilig (Heijne & Werner, 2021)
    plaats: protocols.acl fase 2 evidence
    bronnen: []
    gedekt: nee
    opmerking: >-
      BRON NIET GEVONDEN. Auteur Heijne A heeft acht ACL-publicaties in
      PubMed, geen daarvan uit 2021 met deze inhoud. Volgens CLAUDE.md 1.2
      schrappen tenzij aangewezen. TE VERIFIEREN.

  - id: acl_c11
    tekst: ACL-RSI drempel >= 56 (fase 3) en >= 65 (fase 5) voor doorstroom
    plaats: protocols.acl fase 3 en 5 criteria_go + SCORES.acl
    bronnen: []
    gedekt: nee
    opmerking: >-
      GEEN BRON GEVERIFIEERD. De geraadpleegde ACL-RSI-publicatie
      (webster_2022_aclrsi_adolescent) betreft adolescenten en levert geen
      afkapwaarde. Drempels 56 en 65 zijn niet onderbouwd. TE VERIFIEREN.

  - id: acl_c12
    tekst: IKDC MCID 11,5 punten en drempel >= 85 voor RTS
    plaats: SCORES.acl
    bronnen: []
    gedekt: nee
    opmerking: >-
      GEEN BRON GEVERIFIEERD. TE VERIFIEREN.
