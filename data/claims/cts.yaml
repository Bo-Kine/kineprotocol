protocol: cts
protocol_titel: Carpaaltunnelsyndroom
laatst_gecontroleerd: 2026-09-07
gecontroleerd_door: fase A + fase B (onafhankelijke verificator, schone context) — 2026-09-07
opmerking: >-
  De ernstigste vondst: een systematische review die uitdrukkelijk GEEN bewijs vond
  voor pre- of postoperatieve behandelprogramma's, wordt in dit protocol DRIEMAAL
  aangehaald als bewijs dat postoperatieve handtherapie werkt - en telkens ten
  onrechte als Cochrane-review aangeduid. Daarnaast vergeleek de spalktrial iets
  anders dan de app schreef, met cijfers die er niet in voorkomen.

claims:
  - id: cts_c1
    tekst: >-
      Neutrale polsspalk is significant beter dan geen behandeling bij mild tot
      matig CTS (NRS -2,1; BCTQ-SSS -0,5) (Walker et al., 2000).
    plaats: fase 1 - evidence
    bronnen: [walker_2000_polsspalk_cts]
    gedekt: nee
    opmerking: >-
      Vier fouten in een zin. (1) De trial vergelijkt NACHTELIJK met VOLTIJDS
      dragen; er is GEEN controlegroep zonder behandeling, dus die vergelijking
      bestaat niet. (2) De uitkomstmaten zijn de Levine-vragenlijst en de distale
      latentie van de nervus medianus, niet NRS of BCTQ-SSS. (3) De cijfers -2,1 en
      -0,5 komen er niet in voor. (4) Het gaat om 21 ingesloten patienten waarvan
      er 17 voltooiden - een zeer kleine studie. Wat er wel in staat: voltijds
      dragen gaf een betere distale latentie dan enkel 's nachts (motorisch 0,35
      tegenover -0,07 ms; p = 0,04), bij beperkte therapietrouw.
    verwerkt: vergelijking, uitkomstmaten, omvang en de werkelijke bevinding
      opgenomen

  - id: cts_c2
    tekst: >-
      Vroege mobilisatie is superieur aan immobilisatie na CTS-release
      (Huisstede et al., 2010 - Cochrane).
    plaats: fase 2 - evidence
    bronnen: [huisstede_2010_cts_chirurgie]
    gedekt: nee
    opmerking: >-
      OMGEKEERD. Die review besluit letterlijk: "No evidence was found for the
      efficacy of various presurgical or postsurgical treatment programs, including
      splinting." Ze is bovendien geen Cochrane-review maar verscheen in Archives
      of Physical Medicine and Rehabilitation. Wat ze wel vond: matig bewijs dat
      chirurgie op middellange en lange termijn beter is dan spalken of
      ontstekingsremmers plus handtherapie, en geen bewijs dat een bepaalde
      operatietechniek beter is dan een andere.
    verwerkt: claim geschrapt, de werkelijke conclusie opgenomen

  - id: cts_c3
    tekst: >-
      Handtherapie na CTS-release verbetert grijpkracht en BCTQ sneller dan geen
      therapie (Huisstede et al., 2010 - Cochrane).
    plaats: fase 3 - evidence
    bronnen: [huisstede_2010_cts_chirurgie]
    gedekt: nee
    opmerking: >-
      Dezelfde omkering, tweede keer. De review vond geen bewijs voor
      postoperatieve behandelprogramma's. Dit is de claim waarop de hele derde fase
      van het protocol rust.
    verwerkt: claim geschrapt

  - id: cts_c4
    tekst: >-
      Geen evidentie voor routinehandtherapie langer dan 8 weken bij
      ongecompliceerde CTS-release (Huisstede et al., 2010 - Cochrane).
    plaats: fase 4 - evidence
    bronnen: [huisstede_2010_cts_chirurgie]
    gedekt: deels
    opmerking: >-
      Derde aanhaling van dezelfde bron, en hier klopt de richting wel maar is ze
      te zwak gesteld: er is geen bewijs voor postoperatieve programma's IN HET
      ALGEMEEN, niet enkel boven acht weken. Dat pleit voor terughoudendheid met
      routinematige nabehandeling bij een ongecompliceerde release.
    verwerkt: aangescherpt tot wat de review werkelijk stelt

  - id: cts_c5
    tekst: >-
      Endoscopische en open release geven een vergelijkbaar resultaat, met
      snellere werkhervatting bij endoscopie (11 tegenover 17 dagen, manuele arbeid
      28 dagen) (Atroshi et al., 2009).
    plaats: fase 2 en 4 - evidence
    bronnen: [huisstede_2010_cts_chirurgie]
    gedekt: nee
    opmerking: >-
      Atroshi 2009 is in dit dossier niet opgehaald. De wel opgehaalde review van
      Huisstede vond geen bewijs dat een bepaalde operatietechniek beter is dan een
      andere, wat met het eerste deel van de claim strookt.
    verwerkt: gelabeld

  - id: cts_c6
    tekst: >-
      Lokale corticosteroidinjectie is effectiever dan placebo op 4 tot 8 weken
      (Marshall et al., 2007); zenuwglijdingstechnieken verminderen
      nachtparesthesieen significant (Fernandez-de-las-Penas et al., 2021);
      peesglijden reduceert de intracarpale druk met 34% (Wehbe & Schlegel, 2004).
    plaats: fase 1 - evidence
    bronnen: []
    gedekt: nee
    opmerking: >-
      Geen van drie opgehaald. Het cijfer van 34% is bovendien een precieze
      drukreductie die als vaststaand werd gepresenteerd.
    verwerkt: alle drie gelabeld

  - id: cts_c7
    tekst: >-
      Hervatting van zenuw- en peesglijden in week 2 is cruciaal voor sensorisch
      herstel; littekenmassage in week 3 tot 4 vermindert sensitisatie;
      onmiddellijke vingermobilisatie op dag 1 tot 3 verhindert peesverklevingen
      zonder wondcomplicaties (Bland, 2007).
    plaats: fase 2 en 3 - evidence
    bronnen: []
    gedekt: nee
    opmerking: >-
      Drie niet-opgehaalde toeschrijvingen. Het woord "cruciaal" is bovendien een
      sterke formulering voor een niet nagekeken verband, en de claim staat naast
      een review die geen bewijs vond voor postoperatieve programma's.
    verwerkt: alle gelabeld als klinische richtlijn

  - id: cts_c8
    tekst: Work hardening is effectief voor manuele beroepen (NICE-richtlijn, 2022).
    plaats: fase 4 - evidence
    bronnen: []
    gedekt: nee
    opmerking: In dit dossier niet opgehaald.
    verwerkt: gelabeld

  # Fase B (onafhankelijke verificator, schone context). Beide bronsleutels
  # bibliografisch bevestigd en alle vier gecorrigeerde evidenceteksten letterlijk
  # gedekt, inclusief de voorbehouden.
  - id: cts_c9
    tekst: >-
      Begeleide krachttraining na CTS-release geeft 35% meer grijpkracht op
      8 weken tegenover geen therapie (Huisstede et al., 2010).
    plaats: fase 3 - oefening
    bronnen: [huisstede_2010_cts_chirurgie]
    gedekt: nee
    opmerking: >-
      DE VIERDE KEER DEZELFDE OMKERING, NU MET EEN VERZONNEN PERCENTAGE. Dezelfde
      review die besluit dat er geen bewijs is voor postoperatieve
      behandelprogramma's, levert hier een concreet effect van 35%. Dat cijfer
      staat nergens in de bron. Fase 3 en 4 corrigeerden dit in het evidence-veld;
      de oefeningnote bleef staan - en dat is de tekst die de kinesitherapeut
      leest bij de oefening die hij voorschrijft.
    verwerkt: cijfer geschrapt, de werkelijke conclusie van de review opgenomen

  - id: cts_c10
    tekst: >-
      Neutrale spalk van 0 graden is significant beter dan een extensiespalk van
      20 graden (Walker et al., 2000).
    plaats: fase 1 - oefening
    bronnen: [walker_2000_polsspalk_cts]
    gedekt: nee
    opmerking: >-
      Die vergelijking bestaat niet in de trial, die nachtelijk met voltijds dragen
      vergeleek. Het evidence-veld van dezelfde fase stelt dat uitdrukkelijk vast.
      Tweede verzonnen vergelijking uit dezelfde bron.
    verwerkt: toeschrijving geschrapt, neutrale positie als praktijkafspraak
      gelabeld

  - id: cts_c11
    tekst: >-
      NICE 2022: work hardening vermindert langdurig ziekteverzuim met 40%;
      Shiels 2016: littekenmassage reduceert overgevoeligheid significant;
      Bland 2007: vroege vingermobilisatie verhindert peesverkleving.
    plaats: fase 2, 3 en 4 - oefeningen
    bronnen: []
    gedekt: nee
    opmerking: >-
      Drie effectclaims met een bron die het evidence-veld van dezelfde fase als
      niet-opgehaald markeert, waarvan een met een percentage dat nergens vandaan
      komt.
    verwerkt: alle drie gelabeld, het percentage geschrapt

  - id: cts_c12
    tekst: >-
      Double crush bij 15 tot 20%; recidief 3 tot 10% open en 2 tot 7%
      endoscopisch op vijf jaar; grijpkracht onder 75% na 16 weken als
      stopcriterium; flick sign 93% sensitiviteit; Phalen 68 tot 73%; distale
      latentie boven 4,5 ms.
    plaats: fase 1 en 4 - oefeningen, criteria_stop en kenmerken
    bronnen: []
    gedekt: nee
    opmerking: >-
      Zes ongelabelde harde getallen, waarvan de stopdrempel een verwijzing naar de
      ergotherapeut triggert en de testeigenschappen de diagnostiek sturen.
    verwerkt: alle gelabeld
