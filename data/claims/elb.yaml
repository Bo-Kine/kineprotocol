protocol: elb
protocol_titel: Laterale Epicondylalgie
laatst_gecontroleerd: 2026-09-06
gecontroleerd_door: fase A + fase B (onafhankelijke verificator, schone context) — 2026-09-06
opmerking: >-
  DRIE VAN DE VIJF BRONNEN STONDEN IN HET VERKEERDE TIJDSCHRIFT: Bisset 2006 in
  BMJ (app schreef Lancet), Coombes 2013 in JAMA (app schreef Lancet) en
  Tyler 2010 in J Shoulder Elbow Surg (app schreef JOSPT, zowel in de tekst als
  in het refs-veld). Daarnaast werd uit Coombes 2013 net het resultaat weggelaten
  dat voor dit protocol ongunstig is: kinesitherapie gaf na een jaar geen
  significant verschil. Smidt 2002 stond wel in het refs-veld maar werd nergens
  gebruikt, terwijl die trial de meest concrete cijfers over het beloop bevat.

claims:
  - id: elb_c1
    tekst: >-
      Laterale epicondylalgie is degeneratief, zonder primaire inflammatie
      (Coombes et al., 2015).
    plaats: fase 1 - evidence
    bronnen: [coombes_2015_lateraal_elleboog]
    gedekt: deels
    opmerking: >-
      Klinisch breed gedragen, maar de aangehaalde publicatie is een narratieve
      review die bewijs en EXPERT OPINION samenbrengt en die zelf stelt dat de
      onderliggende pathofysiologie onvoldoende begrepen is. De titel luidt
      bovendien "One Size Does Not Fit All", niet "one model fits all?" zoals het
      refs-veld schreef.
    verwerkt: bewijsniveau en de eigen voorbehoud van de auteurs opgenomen, titel
      gecorrigeerd

  - id: elb_c2
    tekst: >-
      Wait and see is effectief op 1 jaar (78% herstel) maar vertraagt
      kortetermijnherstel (Bisset et al., 2006 - Lancet).
    plaats: fase 1 - evidence
    bronnen: [bisset_2006_tenniselleboog, smidt_2002_epicondylitis]
    gedekt: nee
    opmerking: >-
      Twee fouten. (1) De trial verscheen in BMJ, niet in the Lancet. (2) Het
      cijfer van 78% staat er niet in; het abstract geeft geen percentage voor de
      afwachtgroep, alleen dat op 52 weken geen verschil meer bestond en het
      merendeel van beide groepen een goede uitkomst meldde. Het wel beschikbare
      cijfer komt uit Smidt 2002: 83% na afwachten tegenover 91% na
      kinesitherapie, een verschil dat NIET significant was.
    verwerkt: tijdschrift gecorrigeerd, verzonnen percentage vervangen door de
      cijfers uit Smidt 2002

  - id: elb_c3
    tekst: >-
      Corticosteroidinjecties geven snelle kortetermijnpijnreductie maar
      inferieure langetermijnuitkomsten en hogere recidiefkans
      (Coombes et al., 2013 - Lancet).
    plaats: fase 1 - evidence
    bronnen: [coombes_2013_injectie_kinesitherapie]
    gedekt: deels
    opmerking: >-
      De richting klopt en is met cijfers te onderbouwen (83% tegenover 96%
      herstel na een jaar; 54% tegenover 12% herval), maar de trial verscheen in
      JAMA, niet in the Lancet. BELANGRIJKER: uit dezelfde trial werd het resultaat
      weggelaten dat voor dit protocol ongunstig is - kinesitherapie gaf na een
      jaar GEEN significant verschil (91% tegenover 88%; p = 0,56), en bovenop een
      corticosteroidinjectie voegde ze niets toe. Dat is precies het soort
      tegenstrijdige evidentie dat CLAUDE.md par. 1.9 verbiedt te verzwijgen.
    verwerkt: tijdschrift gecorrigeerd, cijfers toegevoegd, het nulresultaat voor
      kinesitherapie expliciet opgenomen

  - id: elb_c4
    tekst: >-
      Isometrische wrist extension heeft een onmiddellijk pijnmodulerend effect
      (Rio et al., 2015).
    plaats: fase 1 - evidence
    bronnen: [rio_2015_isometrie]
    gedekt: nee
    opmerking: >-
      Rio 2015 onderzocht patellapeestendinopathie. De app noemde de overdracht
      zelf al "analoog aan tendinopathieprotocollen elders", maar presenteerde het
      effect vervolgens als vaststaand voor de elleboog.
    verwerkt: pees benoemd, overdracht als klinische redenering gelabeld

  - id: elb_c5
    tekst: >-
      Tyler Twist: RCT toonde 81% pijnreductie tegenover 22% in de controlegroep
      bij 6 weken (Tyler et al., 2010 - JOSPT).
    plaats: fase 2 - evidence
    bronnen: [tyler_2010_excentrisch_polsextensoren]
    gedekt: deels
    opmerking: >-
      De percentages 81 en 22 kloppen letterlijk (VAS, p = 0,002). Maar: de trial
      verscheen in J Shoulder Elbow Surg, niet in JOSPT; ze telde SLECHTS 21
      patienten (11 tegenover 10); de behandelduur was 7,2 en 7,0 weken, niet zes;
      en de oefening werd TOEGEVOEGD aan de standaardbehandeling, niet ermee
      vergeleken. Bij 21 deelnemers blijft de schatting onnauwkeurig.
    verwerkt: tijdschrift, aantal, duur en opzet gecorrigeerd

  - id: elb_c6
    tekst: >-
      Heavy Slow Resistance met traag tempo is minstens gelijkwaardig aan
      excentrisch alleen (Beyer et al., 2015).
    plaats: fase 2 - evidence
    bronnen: [beyer_2015_hsr_achilles]
    gedekt: nee
    opmerking: >-
      Beyer 2015 onderzocht de ACHILLESPEES. De app schreef zelf "analoog aan
      achillespeesdata", maar gebruikte het resultaat vervolgens als onderbouwing
      voor de elleboog. Dit is de zesde keer dat deze bron in dit dossier bij een
      andere pees opduikt.
    verwerkt: pees benoemd, gelijkwaardigheidsclaim voor de elleboog geschrapt

  - id: elb_c7
    tekst: >-
      Schouder- en polsstabiliteit, grijpkracht en proximale spierkracht zijn
      frequent deficient bij LE (Coombes et al., 2015).
    plaats: fase 2 - evidence
    bronnen: [coombes_2015_lateraal_elleboog]
    gedekt: nee
    opmerking: >-
      Het abstract noemt nekpijn, peesscheuren en centrale sensitisatie als
      mogelijke prognostische factoren; de opgesomde krachtdeficieten staan er in
      die vorm niet in.
    verwerkt: vervangen door wat de review wel noemt, rest als klinische redenering

  - id: elb_c8
    tekst: >-
      Racketaanpassingen reduceren de ECRB-belasting significant
      (Rethnam & Tugh, 2010).
    plaats: fase 3 - evidence
    bronnen: []
    gedekt: nee
    opmerking: >-
      Geen sleutel in references.yaml; in dit dossier niet opgehaald. Het woord
      "significant" suggereert een gemeten effect dat hier niet nagekeken is.
    verwerkt: gelabeld, "significant" geschrapt

  - id: elb_c9
    tekst: >-
      Totale behandelduur gemiddeld 6 tot 12 maanden; PRTEE onder 20 op 100 is
      functioneel herstel, onder 10 volledig sporthervatting.
    plaats: fase 3 - evidence
    bronnen: []
    gedekt: nee
    opmerking: >-
      Geen bron voor de duur noch voor de twee drempels. Wat de literatuur wel
      zegt: de prognose loopt sterk uiteen, van herstel na eenvoudig advies tot
      langdurige klachten ongeacht de behandeling (Coombes 2015).
    verwerkt: gelabeld als praktijkafspraak, met wat de review wel over het beloop
      zegt

  # Fase B (onafhankelijke verificator, schone context). Alle zeven bronsleutels
  # bibliografisch bevestigd en alle drie evidenceteksten letterlijk gedekt;
  # onderstaande punten zijn lekken en ongelabelde drempels elders in het protocol.
  - id: elb_c10
    tekst: >-
      Geelkleuring van de huid ter hoogte van de laterale epicondyl wijst op
      post-injectie vetatrofie.
    plaats: fase 2 - redflags
    bronnen: []
    gedekt: nee
    opmerking: >-
      FEITELIJK ONJUIST in een rode vlag. Huidverandering na corticosteroidinjectie
      is DEPIGMENTATIE - bleek of wit, met inzinking - niet geelkleuring. Een
      kinesitherapeut die op geel wacht, mist het beeld.
    verwerkt: rode vlag inhoudelijk gecorrigeerd naar bleke, ingezonken of
      gedepigmenteerde huid

  - id: elb_c11
    tekst: >-
      Isometrie geeft directe pijnreductie, elke 6 uur herhaalbaar, 30-45 sec op
      50-70% maximaal, 4 sets.
    plaats: fase 1 - oefening en parameters
    bronnen: [rio_2015_isometrie]
    gedekt: nee
    opmerking: >-
      Interne tegenspraak: het evidence-veld labelt de overdracht van Rio 2015
      (patellapees) naar de elleboog wel, de oefeningnote niet. Duur, intensiteit,
      aantal sets en het interval van 6 uur komen uit geen enkele opgehaalde bron.
    verwerkt: gelijkgetrokken met het evidence-veld, doseringen gelabeld

  - id: elb_c12
    tekst: >-
      35% van de patienten met LE heeft scapulaire dyskinese; sensitisatie van de
      nervus radialis is frequent geassocieerd; flexorkracht is ook deficient.
    plaats: fase 1 en 2 - oefeningen
    bronnen: []
    gedekt: nee
    opmerking: >-
      Drie frequentieclaims zonder bron. Coombes 2015 noemt de radialis niet, en
      het krachtdeficit was in elb_c7 al uit het evidence-veld geschrapt maar bleef
      in de oefeningnote staan.
    verwerkt: alle drie gelabeld of geschrapt

  - id: elb_c13
    tekst: >-
      PRTEE onder 40 en knijpkracht boven 50, 75 en 90% als doorstroomcriteria;
      PRTEE boven 40 na 12 weken leidt tot PRP of chirurgie.
    plaats: fase 1 tot 4 - criteria_go en criteria_stop
    bronnen: []
    gedekt: nee
    opmerking: >-
      Zeven ongelabelde drempels die fase-overgangen sturen en zelfs een
      doorverwijzing naar PRP of chirurgie triggeren. In fase 3 werden alleen de
      drempels 20 en 10 gelabeld. De stopregel botst bovendien met de eigen tekst
      dat de behandelduur 6 tot 12 maanden bedraagt.
    verwerkt: alle drempels gelabeld, de stopregel afgezwakt tot heroverweging en
      overleg met de arts

  - id: elb_c14
    tekst: >-
      Cozen-test sensitiviteit 84%; PRTEE boven 30 bevestigt klinische ernst;
      echografische afwijking bij 30%; niet-sporters vormen 60% van de gevallen;
      angiofibroblastische hyperplasie (Nirschl & Pettrone, 1979).
    plaats: kenmerken en oorzaken
    bronnen: []
    gedekt: nee
    opmerking: >-
      Vier harde getallen zonder bron en een citatie zonder sleutel. De drempel
      PRTEE boven 30 botste bovendien met het fasedoel van 40 elders in het
      protocol, en "geen echte inflammatie" werd hier als vaststaand gebracht
      terwijl het evidence-veld net stelt dat de pathofysiologie onvoldoende
      begrepen is (Coombes 2015).
    verwerkt: alle gelabeld, de tegenstrijdige PRTEE-drempel geschrapt

  - id: elb_c15
    tekst: >-
      Mobilization with movement geeft onmiddellijke, meetbare winst in pijnvrije
      grijpkracht; manuele technieken zonder oefenprogramma leiden tot recidief.
    plaats: manuele-therapiemodule (intro)
    bronnen: []
    gedekt: nee
    opmerking: >-
      Twee claims zonder bron, waarvan de tweede een causaal verband stelt dat
      geen enkele bron in dit dossier ondersteunt.
    verwerkt: beide gelabeld als klinische redenering

  - id: elb_c16
    tekst: >-
      Belasting ophogen tot lichaamsgewicht-equivalent met preventief effect;
      open stance forehand vermindert de elleboogbelasting.
    plaats: fase 4 - oefeningen
    bronnen: [beyer_2015_hsr_achilles]
    gedekt: nee
    opmerking: >-
      Beyer 2015 onderzocht de achillespees en rapporteerde geen preventieve
      uitkomst; een lichaamsgewicht-equivalent is voor de polsextensoren bovendien
      niet realistisch. De uitspraak over de forehand heeft geen bron.
    verwerkt: beide gelabeld

  - id: elb_c17
    tekst: >-
      Bij stagnerende PRTEE manipulatie van de elleboog overwegen
      (Vicenzino et al., 2007).
    plaats: fase 2 - criteria_stop
    bronnen: []
    gedekt: nee
    opmerking: >-
      De citatie werd als onderbouwing van een klinische beslisregel gebruikt,
      terwijl het refs-veld van hetzelfde protocol zegt dat ze niet is opgehaald.
    verwerkt: citatie uit de beslisregel gehaald en gelabeld
