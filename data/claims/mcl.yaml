    verwerkt: >-
      herlabeld als klinische redenering in protocols.js (route B, 2026-09-05)

  - id: mcl_c19
    tekst: Nordic Hamstring Exercise reduceert hamstring- en knieletselincidentie met 51%
    plaats: protocols.mcl fase 4 evidence
    bronnen: [vandyk_2019_nordic]
    gedekt: deels
    opmerking: >-
      GECORRIGEERD NA FASE B. De zoekagent gaf n = 942 en RR 0,293 door; die
      getallen horen bij de RCT van Petersen (2011) en niet bij van Dyk (2019),
      en ik heb ze in de eerste herschrijving foutief aan van Dyk toegeschreven.
      De meta-analyse omvat 15 studies en 8459 sporters, met een risicoratio van
      0,49 (95% BI 0,32-0,74) en een reductie tot 51%. De uitkomstmaat is
      uitsluitend HAMSTRINGletsel, niet knieletsel; toepassing binnen een
      MCL-protocol blijft dus klinische redenering.
    verwerkt: >-
      tekst gecorrigeerd naar de bevinding in de bron, met vermelding van populatie en bewijsniveau (route B, 2026-09-05)

  - id: mcl_c20
    tekst: ACL-RSI is een onafhankelijke predictor van sporthervatting en recidief na knieligamentletsel
    plaats: protocols.mcl fase 4 evidence
    bronnen: []
    gedekt: deels
    opmerking: >-
      De onderliggende publicatie (PMID 30753794) betreft uitsluitend
      VKB-RECONSTRUCTIE. Veralgemening naar knieligamentletsel in het algemeen en
      naar MCL is niet gedekt (CLAUDE.md 1.5). Beperken tot VKB of schrappen.
    verwerkt: >-
      cijfer of citatie geschrapt uit protocols.js; klinische lijn behouden als redenering (route B, 2026-09-05)

