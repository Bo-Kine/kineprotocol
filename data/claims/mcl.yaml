protocol: mcl
laatst_gecontroleerd: 2026-09-05
versie: 1
fase_a_door: zoekagent (PubMed) + hoofdagent, metadata eerstehands opgehaald
fase_b_door: onafhankelijke verificator met schone context, 2026-09-05; alle oordelen bevestigd

claims:
  - id: mcl_c01
    tekst: PRICE-protocol reduceert post-traumatische zwelling met 30-40% in de eerste 48 uur
    plaats: protocols.mcl fase 1 evidence
    bronnen: []
    gedekt: nee
    opmerking: >-
      GEEN BRON GEVONDEN voor dit cijfer. De toegeschreven publicatie is niet
      teruggevonden. Volgens CLAUDE.md 1.2 schrappen.

  - id: mcl_c02
    tekst: Vroege functionele mobilisatie na MCL-letsel geeft herstel vergelijkbaar met chirurgie of immobilisatie, met snellere sporthervatting
    plaats: protocols.mcl fase 1 evidence
    bronnen: [reider_1994_mcl]
    gedekt: deels
    opmerking: >-
      Gedekt voor geisoleerde graad III MCL-ruptuur bij sporters. Let op: het is
      een prospectieve serie van 35 patienten ZONDER gerandomiseerde
      vergelijkingsgroep; de vergelijking met chirurgie berust op historische
      cijfers van eerdere onderzoekers. Formulering moet dat weerspiegelen.

  - id: mcl_c03
    tekst: Gesloten-keten oefeningen zijn superieur aan open-keten voor MCL-herstel
    plaats: protocols.mcl fase 2 evidence
    bronnen: []
    gedekt: nee
    opmerking: >-
      GEEN BRON GEVONDEN die gesloten versus open keten bij MCL-letsel
      vergelijkt. De toegeschreven publicatie is niet teruggevonden voor deze
      inhoud. Volgens CLAUDE.md 1.2 schrappen of herschrijven als klinische
      redenering.

  - id: mcl_c04
    tekst: Proprioceptief deficit na MCL-letsel persisteert langdurig
    plaats: protocols.mcl fase 2 evidence
    bronnen: []
    gedekt: nee
    opmerking: GEEN BRON GEVONDEN bij mensen. Schrappen of als redenering labelen.

  - id: mcl_c05
    tekst: Hamstring/quadriceps-ratio >= 0,60 als minimale drempel voor terugkeer naar belastende knieactiviteit
    plaats: protocols.mcl fase 3 evidence + criteria_go
    bronnen: []
    gedekt: nee
    opmerking: >-
      GEEN BRON GEVONDEN voor deze drempel. Betreft een doorstroomcriterium,
      dus klinisch dragend. Schrappen of onderbouwen.

  - id: mcl_c06
    tekst: Neuromusculaire training op instabiele ondergrond verbetert kniestabiliteit meer dan conventionele training
    plaats: protocols.mcl fase 3 evidence
    bronnen: []
    gedekt: nee
    opmerking: GEEN BRON GEVONDEN bij kniebandletsel.

  - id: mcl_c07
    tekst: Symmetrie-index >= 90% op de enkelbeen-hoptest als drempel voor sporthervatting
    plaats: protocols.mcl fase 4 evidence + criteria_go
    bronnen: [barber_1990_hoptest]
    gedekt: nee
    opmerking: >-
      TWEE AFWIJKINGEN. De bron rapporteert 85% symmetrie-index bij meer dan 90%
      van de NORMALE populatie, niet een drempel van 90%. En de patientenpopulatie
      is ACL-deficiente knieen, niet MCL-letsel: toepassing op MCL is
      extrapolatie buiten de onderzochte indicatie (CLAUDE.md 1.5).

  - id: mcl_c08
    tekst: Nordic Hamstring Exercise reduceert hamstring- en knieletselincidentie
    plaats: protocols.mcl fase 4 evidence
    bronnen: [vandyk_2019_nordic]
    gedekt: deels
    opmerking: >-
      Alleen het hamstringdeel is gedekt: risicoratio 0,49, tot 51% reductie
      over 15 studies en 8459 sporters. KNIELETSELINCIDENTIE is in de bron niet
      onderzocht en moet uit de claim.

  - id: mcl_c09
    tekst: Op symmetrie-index gebaseerde return-to-sport-criteria reduceren herletselkans met 84% na knieligamentletsel
    plaats: protocols.mcl fase 5 evidence
    bronnen: [grindem_2016_rtscriteria]
    gedekt: nee
    opmerking: >-
      EXTRAPOLATIE (CLAUDE.md 1.5). De 84% komt uit een cohort van patienten na
      ACL-RECONSTRUCTIE. MCL-letsel zat niet in de populatie. De claim mag zo
      niet op een MCL-protocol staan.

  - id: mcl_c10
    tekst: Recidiefrisico na MCL-letsel bedraagt 12-18% zonder preventief onderhoudsprogramma
    plaats: protocols.mcl fase 5 evidence
    bronnen: []
    gedekt: nee
    opmerking: GEEN BRON GEVONDEN voor dit cijfer. Schrappen.

  - id: mcl_c11
    tekst: ACL-RSI drempels 65 en 80 als doorstroomcriterium bij MCL-letsel
    plaats: protocols.mcl fase 4 en 5 criteria_go
    bronnen: []
    gedekt: nee
    opmerking: >-
      EXTRAPOLATIE (CLAUDE.md 1.5). De ACL-RSI is ontwikkeld en gevalideerd voor
      ACL-letsel. Er is geen validatie bij MCL-letsel gevonden. Betreft een
      doorstroomcriterium voor sporthervatting, dus klinisch dragend.
