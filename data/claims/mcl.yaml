  - id: mcl_c07
    tekst: Symmetrie-index >= 90% op de enkelbeen-hoptest als drempel voor sporthervatting
    plaats: protocols.mcl fase 4 evidence + criteria_go
    bronnen: [barber_1990_hoptest]
    gedekt: nee
    opmerking: >-
      TWEE AFWIJKINGEN. De bron rapporteert 85% symmetrie-index bij meer dan 90%
      van de NORMALE populatie, niet een drempel van 90%. En de patientenpopulatie
      is ACL-deficiente knieen, niet MCL-letsel: toepassing op MCL is
      extrapolatie buiten de onderzochte indicatie (CLAUDE.md 1.5).
    verwerkt: >-
      herlabeld als klinische redenering in protocols.js (route B, 2026-09-05)

  - id: mcl_c08
    tekst: Nordic Hamstring Exercise reduceert hamstring- en knieletselincidentie
    plaats: protocols.mcl fase 4 evidence
    bronnen: [vandyk_2019_nordic]
    gedekt: deels
    opmerking: >-
      Alleen het hamstringdeel is gedekt: risicoratio 0,49, tot 51% reductie
      over 15 studies en 8459 sporters. KNIELETSELINCIDENTIE is in de bron niet
      onderzocht en moet uit de claim.
    verwerkt: >-
      herlabeld als klinische redenering in protocols.js (route B, 2026-09-05)

  - id: mcl_c09
    tekst: Op symmetrie-index gebaseerde return-to-sport-criteria reduceren herletselkans met 84% na knieligamentletsel
    plaats: protocols.mcl fase 5 evidence
    bronnen: [grindem_2016_rtscriteria]
    gedekt: nee
    opmerking: >-
      EXTRAPOLATIE (CLAUDE.md 1.5). De 84% komt uit een cohort van patienten na
      ACL-RECONSTRUCTIE. MCL-letsel zat niet in de populatie. De claim mag zo
      niet op een MCL-protocol staan.
    verwerkt: >-
      herlabeld als klinische redenering in protocols.js (route B, 2026-09-05)

