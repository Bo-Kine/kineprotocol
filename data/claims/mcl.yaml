  - id: mcl_c11
    tekst: ACL-RSI drempels 65 en 80 als doorstroomcriterium bij MCL-letsel
    plaats: protocols.mcl fase 4 en 5 criteria_go
    bronnen: []
    gedekt: nee
    opmerking: >-
      EXTRAPOLATIE (CLAUDE.md 1.5). De ACL-RSI is ontwikkeld en gevalideerd voor
      ACL-letsel. Er is geen validatie bij MCL-letsel gevonden. Betreft een
      doorstroomcriterium voor sporthervatting, dus klinisch dragend.

