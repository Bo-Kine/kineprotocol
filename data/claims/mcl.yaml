    verwerkt: >-
      cijfer of citatie geschrapt uit protocols.js; klinische lijn behouden als redenering (route B, 2026-09-05)

  - id: mcl_c02
    tekst: Vroege functionele mobilisatie na MCL-letsel geeft herstel vergelijkbaar met chirurgie of immobilisatie, met snellere sporthervatting
    plaats: protocols.mcl fase 1 evidence
    bronnen: [reider_1994_mcl]
    gedekt: deels
    opmerking: >-
      Gedekt voor geisoleerde graad III MCL-ruptuur bij sporters. Let op: het is
      een prospectieve serie van 35 patienten ZONDER gerandomiseerde
      vergelijkingsgroep; de vergelijking met chirurgie berust op historische
      cijfers van eerdere onderzoekers. Formulering moet dat weerspiegelen.
    verwerkt: >-
      herlabeld als klinische redenering in protocols.js (route B, 2026-09-05)

  - id: mcl_c03
