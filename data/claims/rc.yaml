protocol: rc
protocol_titel: Rotatorenmanchet
laatst_gecontroleerd: 2026-09-06
gecontroleerd_door: fase A + fase B (onafhankelijke verificator, schone context) — 2026-09-06
opmerking: >-
  Drie van de zeven aangehaalde bronnen ondersteunen het tegendeel of een ander
  onderwerp dan waarvoor ze geciteerd worden: van Rijn 2010 is een risicofactoren-
  review zonder enige interventie, Van der Meijden 2012 stelt net dat de timing van
  postoperatieve revalidatie NIET door bewijs gestuurd wordt, en Burkhart 2003 is
  een narratieve review zonder uitkomstgegevens. Daarnaast worden Rio 2015
  (patellapees) en Beyer 2015 (achillespees) opnieuw aan de schouder toegeschreven.

claims:
  - id: rc_c1
    tekst: >-
      Hawkins-Kennedy: sensitiviteit 79%, specificiteit 66% (Hegedus et al., 2012).
    plaats: kenmerken
    bronnen: [hegedus_2012_schoudertests]
    gedekt: nee
    opmerking: >-
      De sensitiviteit klopt, de specificiteit niet: die is 59%, niet 66%. Ook
      weggelaten: de auteurs besluiten dat geen enkele afzonderlijke schoudertest
      kan worden aanbevolen om een diagnose te stellen.
    verwerkt: cijfer gecorrigeerd, conclusie toegevoegd

  - id: rc_c2
    tekst: Combinatiepatronen van tests zijn betrouwbaarder dan losse tests.
    plaats: fase 1 - evidence
    bronnen: [hegedus_2012_schoudertests]
    gedekt: deels
    opmerking: >-
      De review zegt dat combinaties betere accuraatheid geven, maar voegt er
      letterlijk "marginally so" aan toe. De app liet die beperking weg, waardoor
      een marginale winst als klinisch bruikbare regel klonk.
    verwerkt: beperking toegevoegd, met de gepoolde cijfers per test

  - id: rc_c3
    tekst: >-
      Echografie is de eerste beeldvorming en even accuraat als MRI voor
      volledige rupturen; echografie heeft een accuraatheid van 84%.
    plaats: fase 1 - evidence en kenmerken
    bronnen: []
    gedekt: nee
    opmerking: Geen bron aangehaald; in dit dossier niet nagekeken.
    verwerkt: gelabeld als klinische redenering

  - id: rc_c4
    tekst: >-
      Conservatief beleid voor partiele scheuren en kleine volledige scheuren
      onder 1 cm geeft vergelijkbare uitkomsten met chirurgie op 2 jaar
      (Kukkonen et al., 2015).
    plaats: fase 1 - evidence
    bronnen: [kukkonen_2015_rotatorenmanchet]
    gedekt: deels
    opmerking: >-
      Het gelijke klinische resultaat klopt (Constant-score p = 0,38), maar drie
      dingen niet. (1) De trial hanteert GEEN grens van 1 cm. (2) Ze gaat niet over
      partiele scheuren maar over niet-traumatische supraspinatusscheuren bij
      OUDERE patienten. (3) Weggelaten is dat de scheur na twee jaar significant
      GROTER was zonder herstel (11,0 tegenover 4,2 mm; p < 0,01) en dat de auteurs
      voor die progressie waarschuwen — een veiligheidsrelevante omissie in een
      tekst die het conservatieve beleid verdedigt.
    verwerkt: populatie, ontbrekende grens en de progressiewaarschuwing opgenomen

  - id: rc_c5
    tekst: >-
      Isometrische oefeningen verminderen pijn acuut (Rio et al., 2015).
    plaats: fase 2 - evidence
    bronnen: [rio_2015_isometrie]
    gedekt: nee
    opmerking: >-
      Rio 2015 onderzocht PATELLAPEEStendinopathie bij springers. Dit is de
      zoveelste pees waaraan die studie in dit dossier wordt toegeschreven.
    verwerkt: populatie benoemd, overdracht als klinische redenering gelabeld

  - id: rc_c6
    tekst: 'Draagdoek 4 tot 6 weken na herstel van een volledige ruptuur;
      pendeloefeningen volgens Codman.'
    plaats: fase 2 - evidence
    bronnen: []
    gedekt: nee
    opmerking: Geen bron; gangbare postoperatieve praktijk.
    verwerkt: gelabeld als klinische richtlijn

  - id: rc_c7
    tekst: >-
      Serratus anterior atrofieert bij 68% van de schouderpatienten
      (Cools et al., 2007).
    plaats: fase 3 - evidence
    bronnen: [cools_2007_scapulaoefeningen]
    gedekt: nee
    opmerking: >-
      Verzonnen cijfer. Cools 2007 is een EMG-studie bij 45 GEZONDE proefpersonen
      over de selectie van scapulaoefeningen; er is geen patientenpopulatie, geen
      atrofiemeting en geen percentage van 68%.
    verwerkt: cijfer geschrapt, de werkelijke opzet van de studie benoemd

  - id: rc_c8
    tekst: >-
      Scapulaire stabilisatie is essentieel voor manchetversterking — proximal
      stability for distal mobility (Kibler et al., 2013).
    plaats: fase 3 - evidence
    bronnen: [kibler_2013_scapulaconsensus]
    gedekt: deels
    opmerking: >-
      Het consensusdocument (bewijsniveau 5) stelt uitdrukkelijk dat de rol van
      scapulaire dyskinese bij het ontstaan of verergeren van schouderdisfunctie
      NIET DUIDELIJK OMSCHREVEN is en dat ze het best als een mogelijke stoornis
      wordt gezien, niet als vastgestelde oorzaak. Het woord "essentieel" gaat
      daar ver voorbij.
    verwerkt: nuance en bewijsniveau opgenomen

  - id: rc_c9
    tekst: >-
      Excentrische training voor manchettendinopathie reduceert pijn
      (Bernhardsson et al., 2011).
    plaats: fase 4 - evidence
    bronnen: [bernhardsson_2011_excentrisch_manchet]
    gedekt: deels
    opmerking: >-
      De richting klopt, de bewijskracht niet. Het is geen RCT maar een
      single-subject-opzet bij TIEN patienten met subacromiaal impingement; de
      auteurs besluiten zelf dat een gerandomiseerde trial nodig is voor sterker
      bewijs.
    verwerkt: opzet, aantal en het voorbehoud van de auteurs opgenomen

  - id: rc_c10
    tekst: >-
      High-load training op 70 tot 80% 1RM is superieur voor structurele
      peesadaptatie (Beyer et al., 2015).
    plaats: fase 4 - evidence
    bronnen: [beyer_2015_hsr_achilles]
    gedekt: nee
    opmerking: >-
      Beyer 2015 onderzocht de ACHILLESPEES, niet de rotatorenmanchet. Ook de
      intensiteit van 70-80% 1RM staat er niet zo in.
    verwerkt: pees benoemd, superioriteitsclaim voor de schouder geschrapt

  - id: rc_c11
    tekst: 'ER/IR-verhouding groter of gelijk aan 0,66 aanbevolen (Cools et al., 2007).'
    plaats: fase 4 - evidence
    bronnen: [cools_2007_scapulaoefeningen]
    gedekt: nee
    opmerking: >-
      Die verhouding staat niet in de aangehaalde EMG-studie over scapulaoefeningen.
    verwerkt: toeschrijving geschrapt, als klinische richtlijn gelabeld

  - id: rc_c12
    tekst: Interval throwing program is standaard voor bovenhandse sporters (ASMI-protocol).
    plaats: fase 5 - evidence
    bronnen: []
    gedekt: nee
    opmerking: Het ASMI-protocol is in dit dossier niet opgehaald.
    verwerkt: gelabeld als niet opgehaalde verwijzing

  - id: rc_c13
    tekst: >-
      Correctie van scapulaire dyskinese reduceert het herletselrisico
      (Burkhart et al., 2003).
    plaats: fase 5 - evidence
    bronnen: [burkhart_2003_sick_scapula]
    gedekt: nee
    opmerking: >-
      Deel III van de serie over de werpschouder is een narratieve review zonder
      uitkomstgegevens (PubMed levert zelfs geen abstract). Een effectclaim over
      herletselrisico kan daar niet uit worden afgeleid.
    verwerkt: aard van de publicatie benoemd, effectclaim als klinische redenering
      gelabeld

  - id: rc_c14
    tekst: >-
      Na herstel van grote rupturen mag bovenhandse sport pas na 9 tot 12 maanden
      (Van der Meijden et al., 2012).
    plaats: fase 5 - evidence
    bronnen: [vandermeijden_2012_postoperatieve_revalidatie]
    gedekt: nee
    opmerking: >-
      De aangehaalde review besluit letterlijk dat er WEINIG wetenschappelijk bewijs
      bestaat om de timing van postoperatieve manchetrevalidatie te sturen en dat
      expert opinion daarin bepalend blijft. Ze wordt dus aangehaald voor precies
      het soort tijdsdrempel waarvan ze zegt dat het niet onderbouwd is.
    verwerkt: als praktijkafspraak gelabeld, met de conclusie van de auteurs erbij

  - id: rc_c15
    tekst: Recidief van manchettendinopathie bij 20 tot 40% zonder onderhoudstraining.
    plaats: fase 6 - evidence
    bronnen: []
    gedekt: nee
    opmerking: Geen bron; in dit dossier niet nagekeken.
    verwerkt: gelabeld

  - id: rc_c16
    tekst: >-
      Ergonomische interventies reduceren werkgerelateerde manchetpathologie
      (van Rijn et al., 2010).
    plaats: fase 6 - evidence
    bronnen: [vanrijn_2010_werkfactoren_schouder]
    gedekt: nee
    opmerking: >-
      Dubbele mismatch. (1) De review evalueert GEEN interventies — ze onderzoekt
      het verband tussen werkfactoren en schouderaandoeningen. (2) Geen van de
      ingesloten studies beschreef een verband met ROTATORENMANCHETSCHEUREN; de
      review dekt uitsluitend subacromiaal impingement en bicepstendinitis.
    verwerkt: interventieclaim geschrapt, de werkelijke associaties met odds ratio's
      opgenomen, met de beperking tot impingement

  - id: rc_c17
    tekst: Slapen op de aangedane zijde verhoogt de supraspinatus-ischemie.
    plaats: fase 6 - evidence
    bronnen: []
    gedekt: nee
    opmerking: Geen bron; in dit dossier niet nagekeken.
    verwerkt: gelabeld als klinische redenering

  # Fase B (onafhankelijke verificator, schone context). Alle tien bronsleutels
  # bibliografisch bevestigd en alle evidenceteksten gedekt. Onderstaande punten
  # zijn gelekte claims in de oefening-, parameter-, doel- en criteriavelden.
  - id: rc_c18
    tekst: >-
      Empty can 0,69/0,66; external rotation lag sign 0,70/0,97; lift-off
      0,62/0,97.
    plaats: fase 1 - oefeningparameters
    bronnen: []
    gedekt: nee
    opmerking: >-
      Alleen de sensitiviteiten droegen een voorbehoud, de specificiteiten niet,
      terwijl geen van de zes cijfers in het abstract van Hegedus 2012 staat.
      Omgekeerd droegen de cijfers van Neer (0,72/0,60) en Hawkins-Kennedy
      (0,79/0,59) ten onrechte het label "niet onderbouwd" — die staan er wel
      letterlijk in.
    verwerkt: labels omgedraaid waar ze fout stonden, ontbrekende labels toegevoegd

  - id: rc_c19
    tekst: >-
      Wall slide geeft de laagste trapezius-serratusverhouding van alle oefeningen.
    plaats: fase 3 - oefening
    bronnen: [cools_2007_scapulaoefeningen]
    gedekt: nee
    opmerking: >-
      In strijd met de bron: Cools 2007 onderzocht de wall slide niet, en geen
      enkele van de twaalf onderzochte oefeningen haalde het vooropgestelde
      criterium voor die verhouding.
    verwerkt: claim vervangen door wat de studie wel besluit

  - id: rc_c20
    tekst: >-
      Wand push-up geeft hoge, push-up plus de hoogste serratus-anterioractiviteit.
    plaats: fase 3 en fase 4 - oefeningen
    bronnen: []
    gedekt: nee
    opmerking: EMG-uitspraken zonder bron; niet in Cools 2007.
    verwerkt: gelabeld als niet onderbouwd

  - id: rc_c21
    tekst: >-
      Side-lying ER geeft hoge peeskrachtadaptatie; full can op 60 tot 75% 1RM.
    plaats: fase 4 - oefeningen
    bronnen: [beyer_2015_hsr_achilles]
    gedekt: nee
    opmerking: >-
      Dit is de achillespeesclaim uit rc_c10, die in het evidence-veld werd
      geschrapt maar in de oefeningparameters bleef staan.
    verwerkt: pees benoemd, dosering gelabeld

  - id: rc_c22
    tekst: 'ER/IR-verhouding groter of gelijk aan 0,66 als fasedoel en doorstroomcriterium.'
    plaats: fase 4 - goals en criteria_go
    bronnen: []
    gedekt: nee
    opmerking: >-
      Het evidence-veld labelt dit als klinische richtlijn, de doel- en
      criteriavelden presenteerden het als objectieve drempel.
    verwerkt: gelabeld als praktijkafspraak

  - id: rc_c23
    tekst: >-
      ASMI-schema 45-60-90-120 voet; overhead sport uitstellen tot minstens
      9 maanden.
    plaats: fase 5 - oefening en criteria_stop
    bronnen: [vandermeijden_2012_postoperatieve_revalidatie]
    gedekt: nee
    opmerking: >-
      Beide stonden als harde uitvoerings- en stopcriteria, terwijl het evidence-veld
      het ASMI-protocol als niet-opgehaald markeert en Van der Meijden 2012 juist
      stelt dat de timing niet door bewijs gestuurd wordt.
    verwerkt: beide als praktijkafspraak gelabeld

  - id: rc_c24
    tekst: >-
      Maximaal tilgewicht 23 kg; slapen op de aangedane zijde geeft 6 tot 8 uur
      compressie en ischemie per nacht; recidief frequent bij stoppen met trainen.
    plaats: fase 6 - oefeningen
    bronnen: [vanrijn_2010_werkfactoren_schouder]
    gedekt: nee
    opmerking: >-
      De tillimiet van 23 kg heeft geen bron; van Rijn 2010 noemt tillen boven
      20 kg meer dan tienmaal per dag als RISICOFACTOR, wat iets anders is dan een
      limiet. Het slaapmechanisme met tijdsduur en de recidiefclaim stonden
      ongelabeld, terwijl het evidence-veld ze als klinische redenering markeert.
    verwerkt: alle drie gelabeld

  - id: rc_c25
    tekst: >-
      Echografie heeft een accuraatheid van 84%; scapulohumerale ritmestoornis
      (Ludewig & Cook, 2000).
    plaats: kenmerken en oorzaken
    bronnen: []
    gedekt: nee
    opmerking: >-
      Het cijfer van 84% stond onbeperkt in de beschrijving hoewel rc_c3 het als
      niet nagekeken markeert. De citatie Ludewig & Cook 2000 heeft geen sleutel in
      references.yaml en is in dit dossier niet opgehaald.
    verwerkt: beide gelabeld
