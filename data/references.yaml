      Tweejaarsopvolging van 66 van de oorspronkelijke 82 patienten. BELANGRIJK:
      na de eerste acht weken kregen ALLE patienten het fascia-rekprotocol, dus de
      groepen zijn na dat punt niet meer gescheiden. Na twee jaar was er GEEN
      significant verschil meer tussen de groepen voor ergste pijn of pijn bij de
      eerste stappen; wel meldde 92% tevredenheid, 94% pijnafname en 77% geen
      beperking in recreatieve activiteiten. Het kortetermijnvoordeel na acht
      weken is dus reeel, een blijvend groepsverschil na twee jaar niet.
