    volume_paginas: 320(13):1328-1337
    doi: 10.1001/jama.2018.13308
    pmid: '30285177'
    url: https://doi.org/10.1001/jama.2018.13308
    type: RCT
    opmerking: >-
      Non-inferioriteitstrial, 9 Nederlandse ziekenhuizen, 321 deelnemers van 45
      tot 70 jaar met NIET-OBSTRUCTIEVE scheuren (geen slotklachten). Uitgesloten:
      instabiliteit, ernstige artrose, BMI boven 35. Kinesitherapie (16 sessies
      over 8 weken) was niet-inferieur aan artroscopische partiele meniscectomie
      op de IKDC over 24 maanden; verschil 3,6 punten (97,5% BI tot 6,5).
      29% van de oefengroep onderging alsnog een meniscectomie.
