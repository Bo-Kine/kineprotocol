  # --- Frozen shoulder (adhesieve capsulitis) ---

  - key: diercks_2004_supervised_neglect
    auteurs: [Diercks RL, Stevens M]
    titel: >-
      Gentle thawing of the frozen shoulder: a prospective study of supervised
      neglect versus intensive physical therapy in seventy-seven patients with
      frozen shoulder syndrome followed up for two years
    bron: Journal of Shoulder and Elbow Surgery
    jaar: 2004
    volume_paginas: 13(5):499-502
    doi: 10.1016/j.jse.2004.03.002
    pmid: '15383804'
    url: https://doi.org/10.1016/j.jse.2004.03.002
    type: cohort
    opmerking: >-
      77 patienten met idiopathische frozen shoulder, twee jaar gevolgd. In de groep
      met SUPERVISED NEGLECT (ondersteuning en oefenen BINNEN de pijngrens) had 89%
      na 24 maanden een normale of bijna normale pijnvrije schouderfunctie
      (Constant-score 80 of hoger), en 64% bereikte dat al binnen 12 maanden. In de
      groep met INTENSIEVE kinesitherapie inclusief passief rekken en manuele
      mobilisatie haalde slechts 63% dat na 24 maanden. CONCLUSIE VAN DE AUTEURS:
      supervised neglect geeft BETERE uitkomsten dan intensieve kinesitherapie met
      passief rekken. Dit spreekt de opbouw van een rekgericht protocol
      rechtstreeks tegen.
    geverifieerd_op: 2026-09-06
