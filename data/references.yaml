    doi: 10.1177/2325967118757983
    pmid: '29536022'
    url: https://doi.org/10.1177/2325967118757983
    type: cohort
    opmerking: >-
      174 patienten, gemiddeld 9,7 jaar na het begin van de klachten. Het risico om
      nog klachten te hebben bedroeg 80,5% NA EEN JAAR, 50,0% na vijf jaar, 45,6%
      na tien jaar en 44,0% na vijftien jaar. Bij de follow-up was 54% klachtenvrij
      (gemiddelde klachtenduur 725 dagen) en 46% niet. De prognose was significant
      slechter voor vrouwen en bij bilaterale pijn. Fasciadikte en de aanwezigheid
      van een hielspoor bij aanvang hadden GEEN invloed op de prognose. De auteurs
      stellen uitdrukkelijk dat hun observationele opzet GEEN uitspraak toelaat
