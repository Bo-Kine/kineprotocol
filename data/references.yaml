    opmerking: >-
      Gematchte case-controlstudie, 50 patienten en 100 controles. Dorsaalflexie
      van 0 graden of minder gaf een odds ratio van 23,3 (95% BI 4,3-124,4) ten
      opzichte van meer dan 10 graden. BMI BOVEN 30 kg/m2 gaf OR 5,6 (1,9-16,6)
      ten opzichte van 25 of minder — de drempel is dus 30, niet 27. Het merendeel
      van de werkdag staand gaf OR 3,6 (1,3-10,1). De auteurs besluiten dat
