<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Wger Oefeningen Test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0a0a0b; color: #fafafa; padding: 24px; margin: 0; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p  { color: #71717a; font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: #111113; border: 1px solid #27272a; border-radius: 10px; overflow: hidden; }
  .card img { width: 100%; height: 160px; object-fit: contain; background: #18181b; display: block; }
  .card-body { padding: 12px; }
  .card-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .card-id   { font-size: 10px; color: #52525b; font-family: monospace; }
  .card-status { font-size: 10px; padding: 2px 7px; border-radius: 10px; display: inline-block; margin-top: 4px; }
  .ok   { background: rgba(34,197,94,.15); color: #22c55e; }
  .fail { background: rgba(239,68,68,.15); color: #ef4444; }
  .loading { background: rgba(113,113,122,.15); color: #71717a; }
  #log { background: #111113; border: 1px solid #27272a; border-radius: 8px; padding: 14px;
         font-family: monospace; font-size: 11px; color: #71717a; margin-top: 24px;
         max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Wger Oefeningen Test — 10 standaard oefeningen</h1>
<p>Haalt live data op van wger.de (CC-BY-SA licentie). Open browser-console voor details.</p>
<div class="grid" id="grid"></div>
<div id="log">Log...\n</div>

<script>
// 10 standaard fysiotherapie-oefeningen → wger English zoekterm
const EXERCISES = [
  { nl: 'Squat',                   en: 'Squat' },
  { nl: 'Heupbrug (Bridge)',        en: 'Glute Bridge' },
  { nl: 'Plank',                   en: 'Plank' },
  { nl: 'Kuitheffen (Calf Raise)', en: 'Calf Raise' },
  { nl: 'Zijwaartse heupabductie', en: 'Hip Abduction' },
  { nl: 'Step-up',                 en: 'Step-up' },
  { nl: 'Beenheffen gestrekt (SLR)',en: 'Leg Raise' },
  { nl: 'Hamstring curl',          en: 'Leg Curl' },
  { nl: 'Quadriceps extensie',     en: 'Leg Extension' },
  { nl: 'Dead Bug',                en: 'Dead Bug' },
];

const BASE = 'https://wger.de/api/v2';
let log = '';
function addLog(msg) {
  log += msg + '\n';
  document.getElementById('log').textContent = log;
}

async function fetchImage(exercise, cardEl) {
  const statusEl = cardEl.querySelector('.card-status');
  const imgEl    = cardEl.querySelector('img');
  const idEl     = cardEl.querySelector('.card-id');

  try {
    // 1. Search exercise by English name
    addLog(`→ Zoeken: "${exercise.en}"`);
    const searchUrl = `${BASE}/exercise/search/?term=${encodeURIComponent(exercise.en)}&language=english&format=json`;
    const searchRes = await fetch(searchUrl);
    if(!searchRes.ok) throw new Error('HTTP ' + searchRes.status);
    const searchData = await searchRes.json();

    const suggestions = searchData.suggestions || [];
    if(!suggestions.length) throw new Error('Geen resultaten voor: ' + exercise.en);

    // Take first result's base_id
    const baseId = suggestions[0].data.base_id;
    addLog(`  ✓ Gevonden base_id: ${baseId} (${suggestions[0].value})`);
    idEl.textContent = `wger ID: ${baseId} · ${suggestions[0].value}`;

    // 2. Fetch images for this exercise base
    const imgUrl = `${BASE}/exerciseimage/?format=json&exercise=${baseId}`;
    const imgRes = await fetch(imgUrl);
    if(!imgRes.ok) throw new Error('Image HTTP ' + imgRes.status);
    const imgData = await imgRes.json();

    if(!imgData.results || !imgData.results.length) throw new Error('Geen afbeeldingen voor ID: ' + baseId);

    // Prefer is_main=true
    const mainImg = imgData.results.find(r => r.is_main) || imgData.results[0];
    addLog(`  ✓ Afbeelding: ${mainImg.image}`);

    imgEl.src = mainImg.image;
    imgEl.alt = exercise.nl;
    imgEl.onload  = () => { statusEl.className = 'card-status ok';   statusEl.textContent = '✓ Geladen'; };
    imgEl.onerror = () => { statusEl.className = 'card-status fail';  statusEl.textContent = '✗ Laad-fout'; };

  } catch(err) {
    addLog(`  ✗ Fout: ${err.message}`);
    statusEl.className = 'card-status fail';
    statusEl.textContent = '✗ ' + err.message;
    imgEl.style.cssText = 'height:80px;display:flex;align-items:center;justify-content:center;color:#52525b;font-size:12px;';
    imgEl.outerHTML = `<div style="height:80px;display:flex;align-items:center;justify-content:center;color:#52525b;font-size:11px;background:#18181b;">Geen afbeelding</div>`;
  }
}

// Build cards first, then fetch in parallel
const grid = document.getElementById('grid');
EXERCISES.forEach(ex => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="" alt="${ex.nl}" style="min-height:160px;">
    <div class="card-body">
      <div class="card-name">${ex.nl}</div>
      <div class="card-id">Zoeken naar: "${ex.en}"</div>
      <span class="card-status loading">Laden...</span>
    </div>`;
  grid.appendChild(card);
  fetchImage(ex, card);
});
</script>
</body>
</html>
